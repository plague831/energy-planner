# Сервер планувальника і база PostgreSQL на Render (Blueprint).
# Render → New → Blueprint → цей репозиторій: створить обидва сервіси і сам передасть DATABASE_URL.
# Міграції бази застосовуються автоматично під час запуску сервера.
services:
  - type: web
    name: energy-planner-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start --workspace server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: energy-planner-db
          property: connectionString

databases:
  - name: energy-planner-db
    plan: free
    region: frankfurt
    databaseName: energy_planner
    user: energy_planner
